data:
  symbols:
    - AAPL
    - MSFT
    - GOOGL
  start_date: "2020-01-01"
  end_date: "2024-12-31"
  data_source: "csv"       # csv or yfinance
  data_path: "data/sample" # for csv: data dir; for yfinance: cache dir

execution:
  initial_capital: 10000.0
  commission_pct: 0.001
  slippage_pct: 0.0005

strategy:
  name: "sma_crossover"
  parameters:
    short_window: 20
    long_window: 50

sizing:
  method: "fixed_fraction"  # fixed_fraction, volatility, kelly
  parameters:
    fraction: 0.10

risk:
  enabled: true
  max_position_pct: 0.10
  max_portfolio_exposure_pct: 1.0
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.15
  max_open_positions: 20
  max_orders_per_day: 100

optimization:
  method: "none"            # none, mean_variance, risk_parity
  rebalance_frequency: 20
  parameters: {}
