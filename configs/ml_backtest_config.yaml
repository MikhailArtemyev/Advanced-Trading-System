data:
  symbols:
    - AAPL
    - MSFT
    - GOOGL
  start_date: "2020-01-01"
  end_date: "2024-12-31"
  data_source: "csv"
  data_path: "data/sample"

execution:
  initial_capital: 100000.0
  commission_pct: 0.001
  slippage_pct: 0.0005

strategy:
  name: "ml_strategy"
  parameters:
    signal_threshold: 0.1
    exit_threshold: 0.0
    lookback_bars: 200
    shorts_enabled: false

features:
  technical:
    - type: "sma"
      windows: [5, 10, 20, 50]
    - type: "rsi"
      period: 14
    - type: "macd"
    - type: "bollinger"
      window: 20
    - type: "atr"
      period: 14
  statistical:
    - type: "returns"
      horizons: [1, 5, 10, 20]
    - type: "zscore"
      window: 20
    - type: "higher_moments"
      window: 20
    - type: "volatility"
      windows: [5, 20, 60]
  target:
    horizon: 5
    type: "direction"

ml:
  model: "xgboost"
  mode: "classification"
  parameters:
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8

sizing:
  method: "volatility"
  parameters:
    risk_fraction: 0.02

risk:
  enabled: true
  max_position_pct: 0.10
  max_portfolio_exposure_pct: 1.0
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.15
  max_open_positions: 20
  max_orders_per_day: 100

optimization:
  method: "none"
  rebalance_frequency: 20
  parameters: {}

regime:
  enabled: false
  n_regimes: 3
  vol_window: 20

tracking:
  enabled: false
  experiment_name: "ml_backtest"
