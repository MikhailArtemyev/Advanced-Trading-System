# Backtest: 5-minute mean reversion over past week
# Downloads intraday bars from Alpaca REST API

data:
  symbols:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
    - TSLA
    - MARA
    - COIN
    - SMCI
    - AMD
    - SHOP
    - PLTR
    - ROKU
  data_source: "alpaca"
  data_path: "data/alpaca_cache"
  start_date: "2026-03-20"
  end_date: "2026-03-27"

execution:
  initial_capital: 100000.0
  commission_pct: 0.001
  slippage_pct: 0.0005

strategy:
  name: "mean_reversion"
  parameters:
    lookback_period: 20
    entry_threshold: 2.0
    exit_threshold: 0.5
    max_holding_period: 10

sizing:
  method: "fixed_fraction"
  parameters:
    fraction: 0.10

risk:
  enabled: true
  max_position_pct: 0.40
  max_portfolio_exposure_pct: 1.0
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.15
  max_open_positions: 15
  max_orders_per_day: 10000

optimization:
  method: "mean_variance"
  rebalance_frequency: 20
  parameters:
    target: "max_sharpe"
    max_weight: 0.40

live:
  data:
    bar_interval_seconds: 300
  broker:
    broker_type: "alpaca"
    paper_mode: true
