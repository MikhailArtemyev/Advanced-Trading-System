data:
  symbols:
    - AAPL
    - MSFT
    - GOOGL
  start_date: "2020-01-01"
  end_date: "2024-12-31"
  data_source: "csv"
  data_path: "data/sample"

execution:
  initial_capital: 100000.0
  commission_pct: 0.001
  slippage_pct: 0.0005

strategy:
  name: "sma_crossover"
  parameters:
    short_window: 20
    long_window: 50

sizing:
  method: "volatility"
  parameters:
    risk_fraction: 0.02         # Risk 2% of equity per trade
    atr_period: 14              # 14-bar ATR lookback
    atr_multiplier: 2.0         # Stop distance = 2x ATR
    max_position_fraction: 0.20 # Hard cap at 20% of equity

risk:
  enabled: true
  max_position_pct: 0.20
  max_portfolio_exposure_pct: 1.0
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.15
  max_open_positions: 20
  max_orders_per_day: 100

optimization:
  method: "none"
  rebalance_frequency: 20
  parameters: {}
