# Baseline: Simple SMA crossover, fixed sizing, no optimization
# This is the Phase 1 approach — minimal infrastructure
data:
  symbols:
    - AAPL
    - MSFT
    - GOOGL
  start_date: "2020-01-01"
  end_date: "2024-12-31"
  data_source: "csv"
  data_path: "data/sample"

execution:
  initial_capital: 100000.0
  commission_pct: 0.001
  slippage_pct: 0.0005

strategy:
  name: "sma_crossover"
  parameters:
    short_window: 20
    long_window: 50

sizing:
  method: "fixed_fraction"
  parameters:
    fraction: 0.10

risk:
  enabled: false
  max_position_pct: 1.0
  max_portfolio_exposure_pct: 1.0
  max_daily_loss_pct: 1.0
  max_drawdown_pct: 1.0
  max_open_positions: 100
  max_orders_per_day: 1000

optimization:
  method: "none"
  rebalance_frequency: 20
  parameters: {}
