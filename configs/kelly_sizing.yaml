data:
  symbols:
    - AAPL
    - MSFT
    - GOOGL
  start_date: "2020-01-01"
  end_date: "2024-12-31"
  data_source: "csv"
  data_path: "data/sample"

execution:
  initial_capital: 100000.0
  commission_pct: 0.001
  slippage_pct: 0.0005

strategy:
  name: "sma_crossover"
  parameters:
    short_window: 20
    long_window: 50

sizing:
  method: "kelly"
  parameters:
    kelly_fraction: 0.5        # Half-Kelly for safety
    min_trades: 20             # Trades before Kelly kicks in
    max_position_fraction: 0.25
    default_fraction: 0.10     # Fallback before enough trades

risk:
  enabled: true
  max_position_pct: 0.25
  max_portfolio_exposure_pct: 1.0
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.15
  max_open_positions: 20
  max_orders_per_day: 100

optimization:
  method: "none"
  rebalance_frequency: 20
  parameters: {}
