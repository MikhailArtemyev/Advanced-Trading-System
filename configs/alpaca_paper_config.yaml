# Alpaca Paper Trading Configuration
# Mean-Variance Optimized MultiAsset SMA — best Sharpe (0.683), +44.6% return

data:
  symbols:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    # High volatility
    - NVDA
    - TSLA
    - MARA
    - COIN
    - SMCI
    # Moderate volatility
    - AMD
    - SHOP
    - PLTR
    - ROKU
  data_source: ""
  start_date: ""
  end_date: ""

execution:
  initial_capital: 10000
  commission_pct: 0.001
  slippage_pct: 0.0003

strategy:
  name: "ml_filtered"
  parameters:
    base_strategy: "mean_reversion"
    model_path: "models/ml_filter.joblib"
    threshold: 0.65
    lookback_period: 20
    entry_threshold: 2.0
    exit_threshold: 0.5
    max_holding_period: 10
    stop_loss_atr: 1.5
    take_profit_atr: 3.0
    adx_max: 25.0
    atr_period: 14

sizing:
  method: "fixed_fraction"
  parameters:
    fraction: 0.10

risk:
  enabled: true
  max_position_pct: 0.40
  max_portfolio_exposure_pct: 1.0
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.15
  max_open_positions: 15
  max_orders_per_day: 10000

optimization:
  method: "mean_variance"
  rebalance_frequency: 20
  parameters:
    target: "max_sharpe"
    max_weight: 0.40

live:
  data:
    bar_interval_seconds: 300
  broker:
    broker_type: "alpaca"
    paper_mode: true
  database:
    enabled: false
    db_url: "sqlite:///trading.db"
    save_interval_seconds: 300
