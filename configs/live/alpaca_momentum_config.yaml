# Alpaca Paper Trading — Cross-Sectional Momentum (optimized)
# Ranks 28 stocks by 20-day trailing return, longs top 7
# 10% trailing stop per position + 100-day SMA regime filter
# Regime filter: stay flat when universe average is below 100-day SMA
# Backtested: +5.1% / 13% DD (1yr), +34.2% / 13% DD (2yr), +242% / 19% DD (5yr)

data:
  symbols:
    # Tech mega-caps
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    # Semiconductors
    - NVDA
    - AMD
    - AVGO
    - QCOM
    # High-beta tech
    - TSLA
    - PLTR
    - SMCI
    - COIN
    - MARA
    # Finance
    - JPM
    - GS
    - V
    - MA
    # Healthcare
    - UNH
    - LLY
    - ABBV
    # Energy
    - XOM
    - CVX
    # Consumer
    - COST
    - WMT
    # Safe havens
    - GLD
    - TLT
  data_source: "alpaca"
  data_path: "data/alpaca_cache"
  start_date: "2024-03-28"
  end_date: "2026-03-28"

execution:
  initial_capital: 100000
  commission_pct: 0.001
  slippage_pct: 0.0003

strategy:
  name: "momentum"
  parameters:
    lookback_period: 20
    top_n: 7
    bottom_n: 0
    rebalance_frequency: 5
    min_bars: 25
    min_return: 0.0
    regime_sma_period: 100
    trailing_stop_pct: 0.10
    crash_lookback: 0
    crash_threshold: -0.05
    recovery_bars: 3

sizing:
  method: "volatility"
  parameters:
    risk_fraction: 0.02
    atr_period: 14
    atr_multiplier: 2.0
    max_position_fraction: 0.12


risk:
  enabled: true
  max_position_pct: 0.25
  max_portfolio_exposure_pct: 1.0
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.15
  max_open_positions: 15
  max_orders_per_day: 10000

optimization:
  method: "mean_variance"
  rebalance_frequency: 5
  parameters:
    target: "max_sharpe"
    max_weight: 0.25

live:
  data:
    bar_interval_seconds: 86400
  broker:
    broker_type: "alpaca"
    paper_mode: true
  database:
    enabled: false
    db_url: "sqlite:///trading.db"
    save_interval_seconds: 300
