# ML-filtered mean reversion on 5-minute bars
# XGBoost gates entry signals, blocking predicted losers

data:
  symbols:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
    - TSLA
    - MARA
    - COIN
    - SMCI
    - AMD
    - SHOP
    - PLTR
    - ROKU
  data_source: "alpaca"
  data_path: "data/alpaca_cache"
  start_date: "2026-03-23"
  end_date: "2026-03-29"

execution:
  initial_capital: 100000.0
  commission_pct: 0.001
  slippage_pct: 0.0005

strategy:
  name: "ml_filtered"
  parameters:
    base_strategy: "mean_reversion"
    model_path: "models/ml_filter.joblib"
    threshold: 0.65
    lookback_period: 20
    entry_threshold: 2.0
    exit_threshold: 0.5
    max_holding_period: 10
    stop_loss_atr: 1.5
    take_profit_atr: 2.5
    adx_max: 25.0
    atr_period: 14

sizing:
  method: "volatility"
  parameters:
    risk_fraction: 0.02
    atr_period: 14
    atr_multiplier: 2.0
    max_position_fraction: 0.15

risk:
  enabled: true
  max_position_pct: 0.40
  max_portfolio_exposure_pct: 1.0
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.15
  max_open_positions: 15
  max_orders_per_day: 10000

optimization:
  method: "mean_variance"
  rebalance_frequency: 20
  parameters:
    target: "max_sharpe"
    max_weight: 0.40

live:
  data:
    bar_interval_seconds: 300
  broker:
    broker_type: "alpaca"
    paper_mode: true
